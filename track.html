
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About - Royal Dhaba King</title>
  <link rel="stylesheet" href="track.css" />
</head>
<body>

<div class="container">

  <!-- LANGUAGE -->

  <div class="top-bar">
<select id="countrySelect">

  <option value="usa">
    🇺🇸 English (USA)
  </option>

  <option value="blocked">
    🇫🇷 Français
  </option>

  <option value="blocked">
    🇩🇪 Deutsch
  </option>

  <option value="blocked">
    🇨🇳 简体中文
  </option>

</select>
    
  </div>

  <!-- TITLE -->

  <h1>

    This page doesn't exist.

  </h1>

  <p class="subtitle">

    It looks like the link pointing to this page is faulty.

    Maybe try searching?

  </p>

  <!-- SEARCH -->

  <div class="search-box">

    <input

      type="text"

      id="trackingInput"

      placeholder="Search..."

    >

    <button onclick="checkTracking()">

      🔍

    </button>

  </div>

  <!-- SUCCESS -->

  <div class="tracking-result" id="trackingResult">

    <h2>Package Tracking</h2>

    <p>

      <strong>Tracking ID:</strong>

      <span id="trackId"></span>

    </p>

    <p class="success">

      Your package is currently in transit in the USA.

    </p>

  </div>

  <!-- BLOCK -->

  <div class="blocked-result" id="blockedResult">

    <h2>Page Not Found</h2>

    <p>

      This tracking service is unavailable

      in your selected region.

    </p>

  </div>

</div>

<script src="track.js"></script>

</body>

</html>
